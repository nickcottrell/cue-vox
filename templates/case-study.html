<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>

    <!-- Haberdash CSS (typography tokens) -->
    <link rel="stylesheet" href="https://nickcottrell.github.io/haberdash/haberdash.css">

    <!-- Case study styles -->
    <link rel="stylesheet" href="/static/css/case-study.css">
</head>
<body>
    <article class="case-study">
        <header class="case-study__header">
            <h1 class="case-study__title">{{ title }}</h1>
            {% if intro %}
            <p class="case-study__intro">{{ intro }}</p>
            {% endif %}
        </header>

        <div class="case-study__body">
            {% for img, slide in slides %}
            <section class="case-study__slide">
                <figure class="case-study__figure">
                    <img class="case-study__image"
                         src="{{ img.get('url', img.get('src', '')) }}"
                         alt="{{ slide.get('narrative', img.get('caption', '')) }}"
                         loading="eager">
                    <figcaption class="case-study__caption">{{ slide.get('narrative', '') or img.get('caption', '') }}</figcaption>
                </figure>
            </section>
            {% endfor %}
        </div>

        {% if closing %}
        <footer class="case-study__footer">
            <p class="case-study__closing">{{ closing }}</p>
        </footer>
        {% endif %}
    </article>
</body>
</html>
