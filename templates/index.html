<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cue-vox</title>

    <!-- Haberdash CSS (base components + default tokens) -->
    <link rel="stylesheet" href="https://nickcottrell.github.io/haberdash/haberdash.css">

    <!-- Dynamic VRGB tokens (injected by Spectra) -->
    <style id="vrgb-tokens">/* Tokens will be injected here by JavaScript */</style>

    <!-- VRGB Theme (static fallback) -->
    <link id="themeSheet" rel="stylesheet" href="/static/css/cue-vox-theme.css?v={{ cache_bust }}">

    <!-- Shared icon glyphs -->
    <link rel="stylesheet" href="/static/css/vx-glyphs.css?v={{ cache_bust }}">

    <!-- Layout/Structure (cue-vox-specific) -->
    <link rel="stylesheet" href="/static/css/style.css?v={{ cache_bust }}">

    <!-- Spectra Theme Loader -->
    <script>
        const THEME_NODE_ID = 'haberdash-ui-theme';
        const API_BASE = 'https://zf8klzvd4k.execute-api.us-east-2.amazonaws.com/prod';

        async function loadTheme() {
            try {
                const nodeResponse = await fetch(`${API_BASE}/api/node?node_id=${THEME_NODE_ID}`);
                const nodeData = await nodeResponse.json();

                if (nodeData.unstyled || !nodeData.vrgb) {
                    console.log('Using default unstyled theme');
                    return;
                }

                if (nodeData.vrgb) {
                    const params = new URLSearchParams({
                        d1_hsl: nodeData.vrgb.d1_hsl.join(','),
                        d2_lab: nodeData.vrgb.d2_lab.join(','),
                        d3_lab: nodeData.vrgb.d3_lab.join(','),
                        d4_lab: nodeData.vrgb.d4_lab.join(',')
                    });

                    const generateResponse = await fetch(`${API_BASE}/api/generate?${params}`);
                    const generateData = await generateResponse.json();

                    if (generateData.tokens) {
                        const cssRules = generateData.tokens.__css_rules__ || '';
                        const tokenCSS = Object.entries(generateData.tokens)
                            .filter(([k]) => k !== '__css_rules__')
                            .map(([k, v]) => `${k}: ${v};`)
                            .join(' ');
                        const finalCSS = `:root { ${tokenCSS} }\n\n${cssRules}`;
                        // Stash for theme toggle restore
                        window._spectraCSS = finalCSS;
                        if (localStorage.getItem("cue-vox-theme") !== "off") {
                            document.getElementById('vrgb-tokens').textContent = finalCSS;
                        }
                        console.log('✓ Loaded Spectra theme');
                    }
                }
            } catch (error) {
                console.log('Using static fallback theme:', error);
            }
        }

        loadTheme();
    </script>

    <!-- Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked@14/marked.min.js"></script>

    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>
    <!-- Drop Viewer Overlay -->
    <div class="drop-overlay" id="dropOverlay">
        <span class="drop-overlay__label">drop to view</span>
    </div>

    <!-- Drawer Toggle -->
    <button class="drawer-toggle" id="drawerToggle" aria-label="Toggle conversation">
        💬
    </button>

    <!-- Drawer Panel -->
    <aside class="drawer" id="drawer">
        <!-- Conversation Area -->
        <div class="conversation" id="conversation" role="log" aria-live="polite">
            <a class="pull-trigger" id="pullTrigger" role="button">pull</a>
            <!-- Messages render here as cards -->
        </div>

        <!-- Status Indicator -->
        <div class="drawer-status">
            <span class="status-dot" id="drawerStatusDot" data-state="idle"></span>
            <span class="status-text" id="drawerStatusText">idle</span>
            <a href="#" class="drawer-status__stop-link" id="drawerStopLink" style="display: none;">stop audio</a>
        </div>

        <!-- Text Input -->
        <div class="drawer-input">
            <textarea class="form__input" id="drawerTextInput" placeholder="Type a message..." rows="1"></textarea>
            <button class="btn btn--primary" id="drawerSendButton">Cue</button>
        </div>

    </aside>

    <!-- Theme Toggle -->
    <label class="toggle theme-toggle" id="themeToggle">
        <input class="toggle__input" type="checkbox" id="themeToggleInput" checked>
        <span class="toggle__track"><span class="toggle__thumb"></span></span>
        <span class="toggle__label"></span>
    </label>

    <!-- Text-Size Comfort Slider (label-less; smaller ↔ larger). Anchored
         top-right, symmetric to the corner-fixed toggles. -->
    <div class="text-comfort" id="textComfort">
        <span class="text-comfort__cue text-comfort__cue--sm" aria-hidden="true">A</span>
        <input class="text-comfort__slider" id="textComfortSlider" type="range"
               min="0" max="100" step="1" value="62" aria-label="Text size">
        <span class="text-comfort__cue text-comfort__cue--lg" aria-hidden="true">A</span>
    </div>

    <!-- Main Canvas -->
    <main class="canvas">
        <!-- Session Label -->
        <h1 class="canvas__title" id="sessionTitle">
            cue-vox
        </h1>

        <!-- Pinned Tokens -->
        <nav class="pinned-tokens" id="pinnedTokens" aria-label="Pinned tokens">
            <a class="pinned-clear-all" id="pinnedClearAll" role="button" aria-label="Clear all pinned tokens">clear all</a>
        </nav>

        <!-- Cue-Card Activity Stream -->
        <section class="cue-stream" id="cueStream" aria-label="Cue-card activity stream">
        </section>

        <!-- State Indicator Dot -->
        <div class="state-dot" id="stateDot" role="status" aria-label="System state">
            <div class="state-dot__inner" data-state="idle"></div>
        </div>

        <!-- Stop Audio Button (only visible when speaking) -->
        <button class="btn btn--secondary canvas__stop-btn" id="canvasStopBtn" style="display: none;">
            Stop Audio
        </button>

        <!-- Status Text -->
        <p class="canvas__status" id="canvasStatus" aria-live="polite">
            idle
        </p>

        <!-- Instructions -->
        <p class="canvas__instructions">
            Hold SPACE to talk • Release to process
        </p>

        <!-- Cue-Sheet Launcher -->
        <button class="cuesheet-toggle btn btn--sm btn--secondary" id="cuesheetToggle" aria-label="Do cue-sheet">
            Do
        </button>
        <div class="list-card cuesheet-panel" id="cuesheetPanel" style="display: none;">
            <header class="list-card__header cuesheet-panel__header">
                <h3 class="list-card__title">What would you like to do?</h3>
                <button class="cuesheet-panel__close" id="cuesheetPanelClose" aria-label="Close">&times;</button>
            </header>
            <ul class="list-card__list" id="cuesheetList">
                <li class="list-card__item"><span class="list-card__item-content">loading...</span></li>
            </ul>
        </div>
    </main>

    <!-- Lightbox Modal -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" style="display: none;">
        <div class="lightbox__backdrop" id="lightboxBackdrop"></div>
        <article class="lightbox__content" id="lightboxContent">
            <header class="lightbox__header">
                <h3 class="lightbox__title" id="lightboxTitle"></h3>
                <button class="lightbox__close" id="lightboxClose" aria-label="Close">&times;</button>
            </header>
            <div class="lightbox__body" id="lightboxBody"></div>
            <footer class="lightbox__footer" id="lightboxFooter">
                <button class="btn btn--secondary" id="lightboxUnpinBtn">Let Go</button>
                <button class="btn btn--primary" id="lightboxEditBtn">Change</button>
                <button class="btn btn--secondary" id="lightboxCancelBtn" style="display:none;">Cancel</button>
                <button class="btn btn--primary" id="lightboxSaveBtn" style="display:none;">Save</button>
            </footer>
        </article>
    </div>

    <!-- Human Verification Lightbox -->
    <div class="challenge-lightbox" id="challengeLightbox" role="dialog"
         aria-modal="true" aria-labelledby="challengeTitle" style="display: none;">
        <div class="challenge-lightbox__backdrop"></div>
        <article class="challenge-lightbox__content">
            <header class="challenge-lightbox__header">
                <h3 class="challenge-lightbox__title" id="challengeTitle">calibration</h3>
                <div class="challenge-lightbox__presence" id="challengePresence"
                     aria-label="Presence indicator">
                    <span class="challenge-lightbox__presence-dot"></span>
                </div>
            </header>
            <section class="challenge-lightbox__body" id="challengeBody"></section>
            <footer class="challenge-lightbox__footer" id="challengeFooter">
                <p class="challenge-lightbox__hint" id="challengeHint"></p>
            </footer>
        </article>
    </div>

    <!-- Gallery Lightbox -->
    <div class="gallery-lightbox" id="galleryLightbox" role="dialog"
         aria-modal="true" aria-label="Media gallery" style="display: none;">
        <div class="gallery-lightbox__backdrop"></div>
        <div class="gallery-lightbox__chrome">
            <header class="gallery-lightbox__header">
                <h3 class="gallery-lightbox__title" id="galleryLightboxTitle"></h3>
                <span class="gallery-lightbox__counter" id="galleryLightboxCounter"></span>
                <button class="gallery-lightbox__let-go" id="galleryLetGo" aria-label="Let go" style="display:none">Let Go</button>
                <button class="gallery-lightbox__close" id="galleryLightboxClose" aria-label="Close gallery">&times;</button>
            </header>
            <figure class="gallery-lightbox__stage">
                <button class="gallery-lightbox__nav gallery-lightbox__nav--prev"
                        id="galleryPrev" aria-label="Previous image">&#8249;</button>
                <img class="gallery-lightbox__image" id="galleryLightboxImage" alt="">
                <button class="gallery-lightbox__nav gallery-lightbox__nav--next"
                        id="galleryNext" aria-label="Next image">&#8250;</button>
            </figure>
            <footer class="gallery-lightbox__footer">
                <button class="gallery-lightbox__narrate" id="galleryNarrate" aria-label="Read caption aloud">&#9654;</button>
                <p class="gallery-lightbox__caption" id="galleryLightboxCaption"></p>
                <a class="gallery-lightbox__refine" id="galleryRefine" href="#">refine</a>
            </footer>
        </div>
    </div>

    <!-- Application Script -->
    <script src="/static/js/app.js?v={{ cache_bust }}"></script>
</body>
</html>
